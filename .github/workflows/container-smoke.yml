name: Container smoke test

on:
    pull_request:
    push:
        branches: [main]

jobs:
    smoke:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: docker/setup-buildx-action@v3
            - run: docker build -t commitcv:test .
            - run: |
                  docker run -d --name commitcv -p 8787:8787 commitcv:test
                  for attempt in $(seq 1 30); do
                    curl --fail http://localhost:8787/ && exit 0
                    sleep 1
                  done
                  docker logs commitcv
                  exit 1
            - if: always()
              run: docker rm -f commitcv
